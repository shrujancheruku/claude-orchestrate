name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # README promises 3.9 or later for the guard hook; ubuntu-latest (26.04) has no 3.9 build
        include:
          - { python: "3.9", os: ubuntu-24.04 }
          - { python: "3.x", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover tests
